
server:
  port: 8082

spring:
  application:
    name: grievance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/civic_grievance_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

civic:
  citizen-service:
    url: http://localhost:8081
  escalation:
    check-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info
