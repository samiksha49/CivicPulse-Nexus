
server:
  port: 8081

spring:
  application:
    name: citizen-service

  datasource:
    url: jdbc:postgresql://localhost:5432/civic_citizen_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
